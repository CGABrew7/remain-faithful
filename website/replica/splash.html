<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remain Faithful splash replica</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #12214c; color: #fff; }
    body {
      font-family: "Source Sans 3", "Source Sans Pro", system-ui, sans-serif;
      overflow: hidden;
    }
    .rings { position: fixed; inset: 0; pointer-events: none; }
    .rings i {
      position: absolute;
      left: 50%;
      top: 42%;
      border: 1px solid rgba(240, 208, 48, 0.22);
      border-radius: 999px;
      animation: breathe 16s ease-in-out infinite;
    }
    .rings i:nth-child(1) { width: 180px; height: 180px; margin: -90px 0 0 -90px; }
    .rings i:nth-child(2) { width: 280px; height: 280px; margin: -140px 0 0 -140px; animation-delay: -5.3s; }
    .rings i:nth-child(3) { width: 390px; height: 390px; margin: -195px 0 0 -195px; animation-delay: -10.6s; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.28; }
      50% { transform: scale(1.045); opacity: 0.62; }
    }
    .stage { position: relative; height: 100%; }
    .lockup {
      position: absolute;
      left: 0;
      right: 0;
      top: 42%;
      transform: translateY(-54%);
      text-align: center;
      transition: top 1.2s ease-in-out, transform 1.2s ease-in-out;
    }
    .lockup.settled { top: 78px; transform: translateY(0); }
    .bloom {
      position: absolute;
      left: 50%;
      top: 18px;
      width: 150px;
      height: 150px;
      margin-left: -75px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(240, 208, 48, 0.34), transparent 68%);
      opacity: 0;
      pointer-events: none;
    }
    .shield { position: relative; width: 92px; height: 104px; }
    .word {
      margin-top: 22px;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .word span { display: inline-block; opacity: 0; }
    .rest {
      position: absolute;
      left: 32px;
      right: 32px;
      top: 250px;
      bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.9s ease-in-out 0.15s, transform 0.9s ease-in-out 0.15s;
    }
    .rest.show { opacity: 1; transform: none; }
    .line {
      margin: 8px 0 0;
      font-family: Georgia, serif;
      font-size: 20px;
      line-height: 1.35;
    }
    .verse {
      margin: 22px 0 0;
      font-family: Georgia, serif;
      font-size: 13px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.72);
    }
    .ref { margin: 8px 0 0; color: #f0d030; font-size: 13px; }
    button {
      margin-top: auto;
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      background: #f0d030;
      color: #12214c;
      font: 600 16px/1 system-ui, sans-serif;
    }
    .signin { margin: 16px 0 28px; font-size: 15px; color: rgba(255,255,255,0.55); }
    .signin b { color: #f0d030; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) {
      .rings { display: none; }
      .lockup, .rest { transition: none; }
    }
  </style>
</head>
<body>
  <div class="rings" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="stage">
    <div class="lockup" id="lockup">
      <div class="bloom" id="bloom"></div>
      <svg class="shield" viewBox="0 0 32 36" fill="none" aria-hidden="true">
        <path id="outline" pathLength="100" d="M16 0L2 6V18C2 26.284 8.268 33.916 16 36C23.732 33.916 30 26.284 30 18V6L16 0Z" stroke="#F0D030" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100" />
        <path id="check" pathLength="100" d="M11 18L14.5 21.5L21 14" stroke="#F0D030" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100" />
      </svg>
      <div class="word" id="word" aria-label="Remain Faithful"></div>
    </div>
    <div class="rest" id="rest">
      <p class="line">A covenant group, a partner, and Session Shield.</p>
      <p class="verse">But you must remain faithful to the things you have been taught.</p>
      <p class="ref">2 Timothy 3:14</p>
      <button type="button">Begin Your Journey</button>
      <p class="signin">Already have an account? <b>Sign In</b></p>
    </div>
  </div>
  <script>
    const word = 'Remain Faithful'
    const wordEl = document.getElementById('word')
    word.split('').forEach((ch) => {
      const span = document.createElement('span')
      span.textContent = ch === ' ' ? '\u00a0' : ch
      wordEl.appendChild(span)
    })
    const letters = [...wordEl.children]
    const outline = document.getElementById('outline')
    const check = document.getElementById('check')
    const bloom = document.getElementById('bloom')
    const lockup = document.getElementById('lockup')
    const rest = document.getElementById('rest')
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
    function ease(t) {
      const x = Math.min(1, Math.max(0, t))
      return x < 0.5 ? 2 * x * x : 1 - ((-2 * x + 2) ** 2) / 2
    }
    function showSettled() {
      outline.style.strokeDashoffset = '0'
      check.style.strokeDashoffset = '0'
      letters.forEach((el) => { el.style.opacity = '1' })
      lockup.classList.add('settled')
      rest.classList.add('show')
    }
    if (reduce) {
      showSettled()
    } else {
      const drawMs = 2400
      const letterLead = 2150
      const letterMs = 1400
      const hold = 700
      const start = performance.now()
      function frame(now) {
        const elapsed = now - start
        const draw = ease(elapsed / drawMs)
        outline.style.strokeDashoffset = String(100 - draw * 100)
        const checkU = Math.min(1, Math.max(0, (draw - 0.72) / 0.28))
        check.style.strokeDashoffset = String(100 - checkU * 100)
        const bloomU = elapsed > drawMs ? ease((elapsed - drawMs) / 900) : 0
        const fade = Math.min(1, Math.max(0, (elapsed - letterLead - 400) / 1200))
        bloom.style.opacity = String(bloomU * (1 - fade * 0.65))
        const reveal = elapsed > letterLead ? ease((elapsed - letterLead) / letterMs) : 0
        letters.forEach((el, index) => {
          const span = 1 / letters.length
          const at = index * span * 0.84
          const shown = Math.min(1, Math.max(0, (reveal - at) / Math.max(span, 0.08)))
          el.style.opacity = String(shown)
        })
        if (elapsed >= letterLead + letterMs + hold) {
          lockup.classList.add('settled')
          rest.classList.add('show')
          document.body.dataset.phase = 'settled'
          return
        }
        document.body.dataset.phase = elapsed < drawMs ? 'draw' : 'letters'
        requestAnimationFrame(frame)
      }
      requestAnimationFrame(frame)
    }
  </script>
</body>
</html>
