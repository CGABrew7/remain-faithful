name: Android CI

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: android-debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Copy check
        run: |
          python3 - <<'PY'
          import pathlib
          bad = []
          for path in pathlib.Path("android").rglob("*.kt"):
              text = path.read_text(encoding="utf-8")
              if "\u2014" in text or "\u2013" in text or "honest" in text.lower():
                  bad.append(str(path))
          if bad:
              print("Copy problem in:\n" + "\n".join(bad))
              raise SystemExit(1)
          PY

      - name: Reject real Firebase keys
        run: |
          if grep -R "AIza" android/app/google-services.json; then
            echo "google-services.json must stay a placeholder in this public repo."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Unit tests and debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remain-faithful-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
