name: iOS CI

on:
  pull_request:
    paths:
      - 'RemainFaithful/**'
      - 'RemainFaithfulBroadcast/**'
      - 'RemainFaithfulDeviceActivity/**'
      - 'RemainFaithfulShieldConfig/**'
      - 'RemainFaithfulTests/**'
      - 'RemainFaithfulUITests/**'
      - 'RemainFaithful.xcodeproj/**'
      - '.github/workflows/ios-ci.yml'

permissions:
  contents: read

jobs:
  ios-test:
    name: ios-test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          name="$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone[^(]*\) (.*/\1/p' | head -n 1 | sed 's/[[:space:]]*$//')"
          if [ -z "$name" ]; then
            echo "No iPhone simulator is available"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $name"

      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project RemainFaithful.xcodeproj \
            -scheme RemainFaithful \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:RemainFaithfulTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
